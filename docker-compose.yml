services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    volumes:
      - .:/app
      - launchpad_composer_cache:/home/launchpad/.composer/cache
      - "${LAUNCHPAD_SSH_DIR:-./storage/ssh}:/home/launchpad/.ssh:ro"
      - "${LAUNCHPAD_SOURCE_ROOT:-./storage/sources}:/sources"
      - "${LAUNCHPAD_LOG_ROOT:-./storage/deploy-logs}:/deploy-logs"
    environment:
      APP_ENV: local
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - .:/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    command: php artisan queue:work database --sleep=2 --tries=1 --timeout=0
    restart: unless-stopped
    volumes:
      - .:/app
      - launchpad_composer_cache:/home/launchpad/.composer/cache
      - "${LAUNCHPAD_SSH_DIR:-./storage/ssh}:/home/launchpad/.ssh:ro"
      - "${LAUNCHPAD_SOURCE_ROOT:-./storage/sources}:/sources"
      - "${LAUNCHPAD_LOG_ROOT:-./storage/deploy-logs}:/deploy-logs"
    depends_on:
      mysql:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    command: php artisan schedule:work
    restart: unless-stopped
    volumes:
      - .:/app
      - launchpad_composer_cache:/home/launchpad/.composer/cache
      - "${LAUNCHPAD_SSH_DIR:-./storage/ssh}:/home/launchpad/.ssh:ro"
      - "${LAUNCHPAD_SOURCE_ROOT:-./storage/sources}:/sources"
      - "${LAUNCHPAD_LOG_ROOT:-./storage/deploy-logs}:/deploy-logs"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-launchpad}"
      MYSQL_USER: "${DB_USERNAME:-launchpad}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-launchpad}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-launchpad_root}"
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - launchpad_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-launchpad_root}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  launchpad_mysql:
  launchpad_composer_cache:
